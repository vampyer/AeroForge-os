[package]
name = "aerokernel"
version = "0.5.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "AeroKernel: the AeroForge OS kernel core"

[[bin]]
name = "aerokernel"
test = false
bench = false

[dependencies]
spin = "0.9"
font8x8 = { version = "0.3", default-features = false }

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
debug = true
