# Programs are built for the x86_64 Linux target, not x86_64-unknown-none:
# that one is soft-float only on stable Rust, and programs (games) need
# hardware floating point. Nothing Linux-specific is used: no std, no libc,
# our own linker script and start-up (see build.rs and src/lib.rs).
[build]
target = "x86_64-unknown-linux-gnu"

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "relocation-model=static", "-C", "target-feature=+crt-static"]
