name: boot test

on:
  push:
  pull_request:

jobs:
  boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install build and emulation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm lld xorriso gdisk dosfstools exfatprogs mtools qemu-system-x86 ovmf libusbredirparser-dev samba

      - name: Install Rust target
        run: rustup target add x86_64-unknown-none

      - name: Build and boot in QEMU (UEFI, 4 CPUs, NVMe disk)
        run: TIMEOUT=300 ./tools/boot-test.sh

      - name: Display test on virtio-gpu (no firmware framebuffer)
        run: ./tools/display-test.sh

      - name: Upload ISO and serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aeroforge-${{ github.sha }}
          path: |
            build/aeroforge.iso
            build/boot-test.log
            build/fakebt.log
            build/fakepad.log
            build/display-test.log
            build/*.ppm
          if-no-files-found: ignore
